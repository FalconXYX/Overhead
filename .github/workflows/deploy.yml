# Publishes main to GitHub Pages at https://parthjain.ca/Overhead/ (DECISIONS H1).
# parthjain.ca is the FalconXYX.github.io user site, so this project site is served under /Overhead/ (Pages paths are case-sensitive).
name: Deploy

on:
  push:
    branches: [main]
  # fetch-gp.yml dispatches this after a data push (`gh workflow run deploy.yml --ref main`): pushes made
  # with GITHUB_TOKEN start no workflow. Never workflow_call: a called workflow builds the caller's commit,
  # the one before the data push (DECISIONS, Deploy H1).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
