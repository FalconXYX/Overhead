# Publishes main to GitHub Pages at https://parthjain.ca/overhead/ (DECISIONS H1).
# parthjain.ca is the FalconXYX.github.io user site, so this project site is served under /overhead/.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # M3's fetch-gp.yml calls this after committing data: pushes made with GITHUB_TOKEN
  # never trigger other workflows, so new GP data would otherwise never deploy.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
